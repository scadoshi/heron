name: Deploy

# Not verified: this workflow has never run. It needs a self-hosted runner on the
# server and the setup in context/operations/deploy.md.
#
# Manual only. To deploy on every push to main, add under `on:`
#
#   push:
#     branches: [main]

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  deploy:
    needs: [test, lint]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Deploy
        run: |
          sudo systemctl stop heron
          sudo install -m 755 target/release/heron /usr/local/bin/heron
          sudo systemctl start heron

      - name: Confirm it serves
        # The unit starting is not the server serving. Ask it.
        run: |
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3100/health > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          echo "heron never answered /health" >&2
          sudo journalctl -u heron -n 50 --no-pager >&2
          exit 1
