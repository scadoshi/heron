[package]
name = "heron"
version = "0.1.0"
authors = ["Scotty Fermo <scottyfermo@hotmail.com>"]
edition = "2024"
license = "MIT"
description = "Scotty Fermo's personal server. Serves GitHub stats for his portfolio, cached in steller."
repository = "https://github.com/scadoshi/heron"

[lints]
workspace = true

[lib]
name = "heron"
path = "src/lib/lib.rs"

[[bin]]
name = "heron"
path = "src/bin/heron.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8" }
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15"
flate2 = "1"
measure = { path = "measure" }
mimalloc = "0.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tar = "0.4"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "limit", "timeout", "request-id", "util", "compression-gzip", "compression-br", "set-header"] }
tower_governor = { version = "0.8" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"                             # collect response bodies
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot

[workspace]
members = ["measure"]

[workspace.package]
authors = ["Scotty Fermo <scottyfermo@hotmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/scadoshi/heron"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they catch.
module_name_repetitions = "allow"
# Library crates flip this to "warn": builders and pure functions get #[must_use].
must_use_candidate = "allow"

# Docs: # Errors and # Panics sections everywhere.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Never ship.
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"

# No panics outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# Suppressions are #[expect] with a reason, so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe explains itself, one operation per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# Casts and arithmetic that can silently lose information.
as_conversions = "warn"
arithmetic_side_effects = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
type_complexity = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Logging goes through tracing; a CLI's own output takes an #[expect].
print_stdout = "warn"
print_stderr = "warn"
